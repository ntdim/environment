# === Шрифт ===
font_family      Noto Sans Mono
bold_font        Noto Sans Mono Bold
italic_font      Noto Sans Mono Italic
bold_italic_font Noto Sans Mono Bold Italic
font_size 14.0

# === Прозрачность ===
background_opacity 0.85
dynamic_background_opacity yes

# === Курсор ===
cursor_shape beam
cursor_beam_thickness 2.0
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# === Скроллбар ===
scrollback_lines 10000
show_scrollback yes

# === Анимации (Kitty GPU-based) ===
enable_audio_bell no
visual_bell_duration 0.0
window_padding_width 8 8
remember_window_size  yes
initial_window_width  120c
initial_window_height 35c

# === Тема Kanagawa для Kitty ===
foreground              #dcd7ba
background              #1f1f28
selection_foreground    #1f1f28
selection_background    #dcd7ba
cursor                  #c8c093
cursor_text_color       #1f1f28
url_color               #7a9cd1

# Black
color0 #090618
color8 #727169
# Red
color1 #c34043
color9 #e82424
# Green
color2  #76946a
color10 #98bb6c
# Yellow
color3  #c0a36e
color11 #e6c384
# Blue
color4  #7e9cd8
color12 #7fb4ca
# Magenta
color5  #957fb8
color13 #938aa9
# Cyan
color6  #6a9589
color14 #7aa89f
# White
color7  #c8c093
color15 #dcd7ba

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #1f1f28
active_tab_background   #7e9cd8
inactive_tab_foreground #dcd7ba
inactive_tab_background #2a2a37

# Window borders
active_border_color   #7e9cd8
inactive_border_color #54546d
bell_border_color     #e82424
